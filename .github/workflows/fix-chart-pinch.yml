name: Fix chart pinch zoom

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix pinch ownership
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('artifacts/trading-journal/src/components/charts/CustomChart.tsx')
          s = p.read_text()
          # Native Lightweight Charts owns two-finger pinch. Its implementation
          # zooms around the gesture midpoint; the custom setVisibleLogicalRange
          # loop was fighting it and caused jitter/no zoom.
          s = s.replace('pinch:                false, // we implement pinch-to-zoom ourselves in onTouchStart/onTouchMove',
                        'pinch:                true, // native LWC pinch is the sole two-finger zoom owner')
          s = s.replace('handleScale:   { mouseWheel: false, pinch: false, axisPressedMouseMove:',
                        'handleScale:   { mouseWheel: false, pinch: true, axisPressedMouseMove:')
          old = '''      if (e.touches.length >= 2) {
        if (!ig || ig.mode !== 'PINCH_ZOOM') {
          // Transition any existing single-finger state to PINCH_ZOOM
          const firstPointerId = ig?.pointerId;
          cancelIg();
          pressCount = e.touches.length;
          if (firstPointerId !== undefined && firstPointerId >= 0) {
            try { container.releasePointerCapture(firstPointerId); } catch { /* ok */ }
          }
          ig = {
            mode: 'PINCH_ZOOM', pointerId: -1,
            startX: 0, startY: 0, lastX: 0, lastY: 0,
            lastT: performance.now(), isTouch: true,
            velY: 0, hRafId: null, vRafId: null,
            panMin: null, panMax: null, pricePerPx: null, panActivated: false,
            pinchPrevSpan: null,
          hPendingDx: 0,
          };
        }
        // Block LWC from double-handling, then apply our zoom
        e.stopPropagation();
        applyPinchZoom(e.touches[0], e.touches[1]);
        return;
      }
'''
          new = '''      if (e.touches.length >= 2) {
        // Native Lightweight Charts owns two-finger pinch.
        return;
      }
'''
          s = s.replace(old, new)
          start = s.find('    const onTouchStart = (e: TouchEvent) => {')
          if start >= 0:
            end = s.find('    // ── touchend capture', start)
            if end > start:
              s = s[:start] + '''    const onTouchStart = (e: TouchEvent) => {
      touchCount = e.touches.length;
      // Two-finger gestures are handled natively by Lightweight Charts.
    };

'''+s[end:]
          s = s.replace('''      if (touchCount >= 2) {
        e.stopPropagation();
        return;
      }''', '''      if (touchCount >= 2) {
        return;
      }''')
          # Any runtime recovery path must preserve native pinch too.
          s = s.replace('handleScale:   { mouseWheel: false, pinch: false, axisPressedMouseMove:',
                        'handleScale:   { mouseWheel: false, pinch: true, axisPressedMouseMove:')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal/src/components/charts/CustomChart.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(chart): use native pinch zoom without gesture conflict"
          git push
