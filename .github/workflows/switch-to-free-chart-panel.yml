name: Switch charts page to Free Chart panel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  switch-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replace legacy chart renderer import
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('artifacts/trading-journal/src/pages/charts.tsx')
          s = p.read_text()
          old = 'import CustomChart from "@/components/charts/CustomChart";'
          new = 'import CustomChart from "@/components/charts/FreeChartEmbed";'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Commit renderer switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal/src/pages/charts.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(chart): switch charts page to Free Chart renderer"
          git push
