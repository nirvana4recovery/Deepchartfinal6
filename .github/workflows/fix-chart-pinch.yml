name: Fix chart pinch zoom

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch zoom-out range
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('artifacts/trading-journal/src/components/charts/CustomChart.tsx')
          s = p.read_text()
          # Root cause of limited zoom-out: LWC minBarSpacing was 4px.
          # Lower it so two-finger horizontal zoom-out can continue much further.
          s = s.replace('minBarSpacing:   4,', 'minBarSpacing:   0.01,')
          if 'maxBarSpacing:' not in s:
              s = s.replace('minBarSpacing:   0.01,', 'minBarSpacing:   0.01,\n        maxBarSpacing:   5000,', 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal/src/components/charts/CustomChart.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(chart): remove zoom-out bar-spacing limit"
          git push
