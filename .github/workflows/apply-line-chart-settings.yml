name: Apply line chart settings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply chart interaction patch
        run: node .github/scripts/patch-chart-interaction.cjs

      - name: Apply pinch zoom anchor patch
        run: node .github/scripts/patch-pinch-zoom.cjs

      - name: Validate patch
        run: git diff --check

      - name: Commit chart interaction patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/trading-journal/src/components/charts/CustomChart.tsx
            git add artifacts/trading-journal/src/components/charts/DrawingToolbar.tsx
            git commit -m "Fix chart viewport and pinch zoom anchor"
            git push
          fi
