name: Fix chart pinch zoom

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix pinch zoom behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('artifacts/trading-journal/src/components/charts/CustomChart.tsx')
          s = p.read_text()

          # Native Lightweight Charts must be the only owner of two-finger pinch.
          # The previous custom touchmove/setVisibleLogicalRange loop caused
          # jitter because it competed with LWC's internal gesture state.
          s = s.replace(
            'pinch:                false, // we implement pinch-to-zoom ourselves in onTouchStart/onTouchMove',
            'pinch:                true, // native LWC owns two-finger pinch'
          )
          s = s.replace(
            'handleScale:   { mouseWheel: false, pinch: false, axisPressedMouseMove:',
            'handleScale:   { mouseWheel: false, pinch: true, axisPressedMouseMove:'
          )

          # Disable the old custom pinch path completely.
          start = s.find('    const onTouchStart = (e: TouchEvent) => {')
          if start >= 0:
            end = s.find('    // ── touchend capture', start)
            if end > start:
              s = s[:start] + '''    const onTouchStart = (e: TouchEvent) => {
      // Two-finger pinch is handled exclusively by Lightweight Charts.
      // Keep only the touch-count bookkeeping needed by the single-finger
      // gesture state machine.
      touchCount = e.touches.length;
    };

''' + s[end:]

          # Never intercept a two-finger touchmove; let LWC receive the native
          # gesture directly. Single-finger touch behavior remains unchanged.
          marker = '      // ── Two-finger pinch: enter PINCH_ZOOM if we aren\'t already ──────────'
          start = s.find(marker)
          if start >= 0:
            end = s.find('      if (!ig) return;', start)
            if end > start:
              s = s[:start] + '''      // Native Lightweight Charts exclusively owns two-finger pinch.
      if (e.touches.length >= 2) return;

''' + s[end:]

          # Remove the explicit logical-range clamp from the legacy helper too,
          # so no stale custom path can impose a 3..500000 bar limit.
          s = s.replace(
            'const newBars = Math.max(3, Math.min(500_000, currentBars * ratio));',
            'const newBars = currentBars * ratio;'
          )

          # Allow LWC to zoom much further than the old 4px minimum bar spacing.
          # A small positive value avoids a zero-width candle while effectively
          # removing the application-level zoom ceiling.
          s = s.replace('minBarSpacing:   4,', 'minBarSpacing:   0.1,')

          # Do not let the custom price-scale touch strip steal two-finger gestures.
          # It remains available for deliberate one-finger vertical scale drags.
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal/src/components/charts/CustomChart.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(chart): preserve price scale and remove pinch zoom limits"
          git push
