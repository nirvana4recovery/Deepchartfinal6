name: Fix chart pinch zoom

on:
  push:
    paths:
      - .github/workflows/fix-chart-pinch.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch pinch zoom anchoring
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('artifacts/trading-journal/src/components/charts/CustomChart.tsx')
          s = p.read_text()

          start = s.index('    const applyPinchZoom = (t0: Touch, t1: Touch) => {')
          end = s.index('    // ── touchstart capture', start)

          replacement = r'''    // Pinch zoom state is kept outside the gesture object so the zoom anchor
    // survives the incremental range updates. The old implementation recalculated
    // the logical anchor from the *already changed* range on every frame. When the
    // midpoint was in the future/blank area, coordinateToLogical() returned null
    // and the fallback used the range midpoint, which made the whole chart drift
    // left/right while zooming. Keep the original finger midpoint + logical bar
    // anchor fixed for the complete pinch gesture instead.
    let pinchAnchorLogical: number | null = null;
    let pinchAnchorX = 0;

    const resetPinchAnchor = () => {
      pinchAnchorLogical = null;
      pinchAnchorX = 0;
      if (ig) ig.pinchPrevSpan = null;
    };

    const applyPinchZoom = (t0: Touch, t1: Touch) => {
      if (!ig || ig.mode !== 'PINCH_ZOOM') return;

      const span = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      if (span < 1) return;

      const ch = chartRef.current;
      const range = ch?.timeScale().getVisibleLogicalRange();
      if (!ch || !range) return;

      // First frame: establish one immutable screen/logical anchor.
      if (ig.pinchPrevSpan === null || pinchAnchorLogical === null) {
        ig.pinchPrevSpan = span;
        const rect = container.getBoundingClientRect();
        pinchAnchorX = Math.max(0, Math.min(container.clientWidth - 1,
          ((t0.clientX + t1.clientX) / 2) - rect.left));
        const currentBars = (range.to as number) - (range.from as number);
        if (currentBars <= 0) return;
        pinchAnchorLogical = ch.timeScale().coordinateToLogical(pinchAnchorX);
        // If the fingers are in the blank/future area, extrapolate the logical
        // coordinate from the visible range instead of falling back to the center.
        if (pinchAnchorLogical === null) {
          const left = range.from as number;
          const right = range.to as number;
          const w = Math.max(1, container.clientWidth);
          pinchAnchorLogical = left + (pinchAnchorX / w) * (right - left);
        }
        return;
      }

      const prevSpan = ig.pinchPrevSpan;
      ig.pinchPrevSpan = span;
      if (prevSpan === span) return;

      const currentBars = (range.to as number) - (range.from as number);
      if (!(currentBars > 0)) return;

      manualViewportLockRef.current = true;
      const ratio = prevSpan / span;
      const newBars = Math.max(3, Math.min(500_000, currentBars * ratio));
      if (Math.abs(newBars - currentBars) < 0.0001) return;

      // Preserve the same logical bar under the original finger midpoint.
      // This prevents incremental zoom drift and keeps the chart visually locked
      // beneath the user's fingers, including when zooming over future whitespace.
      const w = Math.max(1, container.clientWidth);
      const anchorFrac = Math.max(0, Math.min(1, pinchAnchorX / w));
      let newFrom = (pinchAnchorLogical as number) - newBars * anchorFrac;
      let newTo = newFrom + newBars;

      // Keep a reasonable amount of the logical range visible without moving the
      // anchor unnecessarily. Only clamp if the requested range is non-finite.
      if (!Number.isFinite(newFrom) || !Number.isFinite(newTo)) return;
      try {
        ch.timeScale().setVisibleLogicalRange({ from: newFrom, to: newTo });
      } catch { /* ignore range-clamp errors */ }
    };

'''

          s = s[:start] + replacement + s[end:]
          p.write_text(s)

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal/src/components/charts/CustomChart.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix pinch zoom chart anchor drift"
          git push